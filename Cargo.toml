[workspace]
resolver = "3"
members = ["macros", "tests/kit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/dphfox/sugary"

[package]
name = "sugary"
description = "Nicer function parameters for Rust: named, default and inherited arguments that compile to plain calls"
readme = "README.md"
keywords = ["named-arguments", "default-arguments", "macro"]
categories = ["rust-patterns"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sugary-macros = { version = "0.1.0", path = "macros" }

[dev-dependencies]
sugary-test-kit = { path = "tests/kit" }
